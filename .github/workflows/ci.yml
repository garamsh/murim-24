name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: read-all

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python -m venv .venv && .venv/bin/pip install --require-hashes -r core/requirements.txt
      - run: .github/scripts/install-godot.sh "$RUNNER_TEMP/godot" && echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - run: make ci
