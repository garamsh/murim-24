version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/core"
    schedule:
      interval: "weekly"
    groups:
      llvm:
        patterns:
          - "clang-format"
          - "clang-tidy"
    ignore:
      - dependency-name: "clang-*"
        update-types:
          - "version-update:semver-major"
